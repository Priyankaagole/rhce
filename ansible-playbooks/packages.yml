---
- name: Install PHP and MariaDB Packages
  hosts: dev,test,prod
  become: true

  tasks:
    - name: Install php and mariadb
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present

- name: Install RPM Development Tools and Update Development
  hosts: dev
  become: true

  tasks:
    - name: Install RPM Development Tools
      ansible.builtin.dnf:
        name: "@RPM Development Tools"
        state: present

    - name: Update all packages on Development Hosts
      ansible.builtin.dnf:
        name: "*"
        state: latest
    